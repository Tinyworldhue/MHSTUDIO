<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0a08"><title>مدیریت MH STUDIO</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b0a08;--panel:#15120d;--line:#3b3020;--gold:#d9bd83;--text:#f5f0e6;--muted:#b4a995}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#302312 0,transparent 38%),var(--bg);color:var(--text);font-family:Vazirmatn,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{max-width:1150px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:15px 0 22px}.brand{font-weight:900;letter-spacing:2px;direction:ltr}.brand small{display:block;direction:rtl;letter-spacing:0;color:var(--muted);font-weight:400;font-size:11px}.gold{color:var(--gold)}.panel{background:#14110d;border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:22px}.auth{max-width:460px;margin:9vh auto}.h{font-size:25px;margin:0 0 8px}.muted{color:var(--muted);font-size:13px;line-height:2}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:12px;color:var(--muted)}input,textarea,select{width:100%;background:#0d0b08;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:12px;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--gold)}textarea{min-height:90px;resize:vertical}.btn{border:1px solid var(--gold);background:linear-gradient(120deg,#f0dfb7,#b48c4e);color:#171109;border-radius:9px;padding:11px 18px;font-weight:700}.btn.secondary{background:transparent;color:var(--gold)}.btn.danger{border-color:#8f4c43;color:#f1b1a8;background:transparent}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tab{border:1px solid var(--line);color:var(--text);background:#17130e;padding:10px 15px;border-radius:9px}.tab.active{border-color:var(--gold);color:var(--gold)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.item{border:1px solid var(--line);border-radius:12px;padding:15px;display:flex;gap:13px;align-items:center}.item img{width:70px;height:70px;object-fit:cover;border-radius:8px;background:#272016}.item strong{display:block}.item small{color:var(--muted)}.item .actions{margin:5px 0 0}.hidden{display:none!important}.status{padding:11px 13px;border:1px solid var(--line);border-radius:9px;color:var(--gold);font-size:12px;margin-top:12px;white-space:pre-wrap}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.wide{grid-column:1/-1}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{color:var(--gold)}@media(max-width:650px){.wrap{padding:15px}.grid,.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}.panel{padding:16px}.h{font-size:21px}.top{align-items:flex-start}}
</style>
</head>
<body><div class="wrap">
<header class="top"><div class="brand">MH <span class="gold">STUDIO</span><small>پنل مدیریت محتوا و فروشگاه</small></div><button id="logout" class="btn secondary hidden">خروج</button></header>
<section id="auth" class="panel auth">
<h1 class="h">ورود مدیر</h1><p class="muted">با ایمیل تعیین‌شده برای مدیریت وارد شو. اگر هنوز حساب نساخته‌ای، ابتدا حساب بساز؛ سپس دسترسی مدیر توسط سیستم فعال می‌شود.</p>
<div class="field"><label>ایمیل مدیر</label><input id="email" type="email" value="sayedmurtaza2200@gmail.com" autocomplete="email"></div>
<div class="field"><label>رمز عبور</label><input id="password" type="password" autocomplete="current-password" placeholder="حداقل ۸ کاراکتر"></div>
<div class="actions"><button id="login" class="btn">ورود</button><button id="signup" class="btn secondary">ساخت حساب مدیر</button></div><div id="authmsg" class="status hidden"></div>
</section>
<section id="app" class="hidden">
<div class="panel"><div class="bar"><div><h1 class="h">داشبورد مدیریت</h1><div class="muted" id="who"></div></div><span class="gold">MH / CONTROL CENTER</span></div>
<div class="tabs"><button class="tab active" data-tab="products">محصولات</button><button class="tab" data-tab="portfolio">نمونه‌کارها</button><button class="tab" data-tab="services">خدمات</button><button class="tab" data-tab="orders">سفارش‌ها</button></div>
<div id="workspace"></div><div id="msg" class="status hidden"></div></div>
</section></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL='https://ycahzbtjwefcpfhlskke.supabase.co';
const SUPABASE_KEY='sb_publishable_VlrvDgFsvTWu4mlWkkJ5VA_B-q5FWqK';
const db=createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);let currentTab='products';let editing=null;let rows=[];
function note(id,s){$(id).textContent=s;$(id).classList.remove('hidden')}
function safe(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function authState(){const {data:{session}}=await db.auth.getSession();if(session){const {data,error}=await db.from('mh_admins').select('user_id').eq('user_id',session.user.id).maybeSingle();if(data&&!error){$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');$('who').textContent=session.user.email;load()}else{await db.auth.signOut();$('auth').classList.remove('hidden');note('authmsg','حساب ساخته شده، اما دسترسی مدیر هنوز فعال نشده است. پس از ثبت حساب، مدیر باید دسترسی را در پایگاه داده تأیید کند.')}}}
$('login').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)note('authmsg',error.message);else await authState()};
$('signup').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(email.toLowerCase()!=='sayedmurtaza2200@gmail.com'){note('authmsg','این پنل فقط برای ایمیل مدیر تعیین‌شده است.');return}if(password.length<8){note('authmsg','رمز عبور باید حداقل ۸ کاراکتر باشد.');return}const {error}=await db.auth.signUp({email,password});if(error)note('authmsg',error.message);else note('authmsg','درخواست ساخت حساب ثبت شد. اگر تأیید ایمیل فعال باشد، ایمیل را تأیید کن. سپس برای فعال‌سازی دسترسی مدیر اطلاع بده.')};
$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentTab=b.dataset.tab;editing=null;load()});
const configs={products:{table:'mh_products',title:'محصول',fields:[['name','نام محصول'],['slug','شناسه انگلیسی (بدون فاصله)'],['description','توضیحات','textarea'],['price','قیمت (AFN)','number'],['category','دسته‌بندی'],['stock','موجودی','number']]},portfolio:{table:'mh_portfolio',title:'نمونه‌کار',fields:[['title','عنوان'],['slug','شناسه انگلیسی (بدون فاصله)'],['summary','توضیحات','textarea'],['category','دسته‌بندی'],['project_url','لینک پروژه']]},services:{table:'mh_services',title:'خدمت',fields:[['title','عنوان خدمت'],['slug','شناسه انگلیسی (بدون فاصله)'],['description','توضیحات','textarea'],['price_label','نمایش قیمت'],['category','دسته‌بندی']]}}
async function load(){if(currentTab==='orders')return loadOrders();const c=configs[currentTab];const {data,error}=await db.from(c.table).select('*').order('created_at',{ascending:false});if(error){note('msg',error.message);return}rows=data||[];renderList()}
function renderList(){const c=configs[currentTab];$('workspace').innerHTML='<div class="bar"><div><h2 class="h">'+c.title+'ها</h2><p class="muted">افزودن، ویرایش، حذف و بارگذاری تصویر از موبایل</p></div><button id="new" class="btn">+ افزودن '+c.title+'</button></div><div id="editor"></div><div class="grid" id="list"></div>'; $('new').onclick=()=>form();$('list').innerHTML=rows.map(r=>'<article class="item">'+(r.image_url?'<img src="'+safe(r.image_url)+'">':'<div class="item" style="width:70px;height:70px;justify-content:center">MH</div>')+'<div style="min-width:0;flex:1"><strong>'+safe(r.name||r.title)+'</strong><small>'+(r.price!=null?safe(r.price)+' '+safe(r.currency||'AFN')+' · ':'')+safe(r.category||'')+'</small><div class="actions"><button class="tab" data-edit="'+r.id+'">ویرایش</button><button class="tab" data-del="'+r.id+'">حذف</button></div></div></article>').join('')||'<p class="muted">هنوز موردی ثبت نشده است.</p>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>form(rows.find(r=>r.id===b.dataset.edit)));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>removeItem(b.dataset.del))}
function form(r={}){editing=r.id||null;const c=configs[currentTab];$('editor').innerHTML='<div class="panel"><h3 class="h">'+(editing?'ویرایش':'افزودن')+' '+c.title+'</h3><div class="formgrid">'+c.fields.map(([k,l,t])=>'<div class="field '+(t==='textarea'?'wide':'')+'"><label>'+l+'</label>'+(t==='textarea'?'<textarea id="f_'+k+'">'+safe(r[k]||'')+'</textarea>':'<input id="f_'+k+'" type="'+(t||'text')+'" value="'+safe(r[k]??'')+'">')+'</div>').join('')+'<div class="field wide"><label>تصویر</label><input id="image" type="file" accept="image/jpeg,image/png,image/webp,image/avif"><small class="muted">'+(r.image_url?'تصویر فعلی ثبت شده است. برای جایگزینی فایل جدید انتخاب کن.':'حداکثر ۵ مگابایت؛ JPG، PNG یا WebP')+'</small></div></div><div class="actions"><button id="save" class="btn">ذخیره</button><button id="cancel" class="btn secondary">انصراف</button></div></div>'; $('cancel').onclick=()=>{$('editor').innerHTML='';editing=null};$('save').onclick=()=>saveItem(r)}
async function saveItem(old){const c=configs[currentTab],payload={};for(const [k] of c.fields){const el=$('f_'+k);payload[k]=el.value.trim()||null}if(!payload.name&&!payload.title){note('msg','عنوان الزامی است.');return}if(!payload.slug){note('msg','شناسه انگلیسی الزامی است.');return}if(currentTab==='products'){payload.price=payload.price?Number(payload.price):null;payload.stock=Number(payload.stock||0);payload.is_active=true}else if(currentTab==='portfolio')payload.is_published=true;else payload.is_active=true;
const file=$('image').files[0];if(file){if(file.size>5*1024*1024){note('msg','حجم تصویر بیشتر از ۵ مگابایت است.');return}const ext=file.name.split('.').pop().toLowerCase(),path=currentTab+'/'+crypto.randomUUID()+'.'+ext;const {error:upErr}=await db.storage.from('mh-media').upload(path,file,{upsert:false,contentType:file.type});if(upErr){note('msg',upErr.message);return}payload.image_url=db.storage.from('mh-media').getPublicUrl(path).data.publicUrl}
const q=editing?db.from(c.table).update(payload).eq('id',editing):db.from(c.table).insert(payload);const {error}=await q;if(error){note('msg',error.message);return}note('msg','ذخیره شد.');editing=null;load()}
async function removeItem(id){if(!confirm('این مورد حذف شود؟'))return;const {error}=await db.from(configs[currentTab].table).delete().eq('id',id);if(error)note('msg',error.message);else load()}
async function loadOrders(){const {data,error}=await db.from('mh_orders').select('*').order('created_at',{ascending:false});if(error){$('workspace').innerHTML='<p class="muted">خطا در دریافت سفارش‌ها: '+safe(error.message)+'</p>';return}$('workspace').innerHTML='<h2 class="h">سفارش‌های مشتریان</h2><p class="muted">سفارش‌های ثبت‌شده در سایت در این بخش نمایش داده می‌شوند.</p><div class="tablewrap"><table><thead><tr><th>محصول</th><th>مشتری</th><th>تماس</th><th>تعداد</th><th>وضعیت</th><th>تاریخ</th></tr></thead><tbody>'+(data||[]).map(o=>'<tr><td>'+safe(o.product_name)+'</td><td>'+safe(o.customer_name)+'</td><td>'+safe(o.customer_phone)+'</td><td>'+o.quantity+'</td><td><select data-status="'+o.id+'"><option value="new" '+(o.status==='new'?'selected':'')+'>جدید</option><option value="contacted" '+(o.status==='contacted'?'selected':'')+'>پیگیری شد</option><option value="completed" '+(o.status==='completed'?'selected':'')+'>تکمیل شد</option><option value="cancelled" '+(o.status==='cancelled'?'selected':'')+'>لغو شد</option></select></td><td>'+new Date(o.created_at).toLocaleDateString('fa-IR')+'</td></tr>').join('')+'</tbody></table></div>';document.querySelectorAll('[data-status]').forEach(s=>s.onchange=async()=>{const {error}=await db.from('mh_orders').update({status:s.value}).eq('id',s.dataset.status);if(error)note('msg',error.message)})}
authState();
</script></body></html>
